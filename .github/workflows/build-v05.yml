name: Build NC v0.5

on:
  push:
    branches: [main]
    paths:
      - 'data/source/**'
      - 'data/reviewed/v0.4/**'
      - 'schemas/**'
      - 'scripts/build_v05.py'
      - '.github/workflows/build-v05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate v0.5
        run: python scripts/build_v05.py

      - name: Commit generated artifacts when changed
        shell: bash
        run: |
          if git diff --quiet -- data/v0.5 audit/v0.5-qa-report.md; then
            echo 'Generated v0.5 artifacts are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v0.5 audit/v0.5-qa-report.md
          git commit -m 'build: regenerate NC v0.5 artifacts'
          git push
