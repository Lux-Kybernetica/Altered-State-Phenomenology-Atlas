name: Build NC v0.5

on:
  push:
    branches: [main]
    paths:
      - 'data/source/**'
      - 'data/reviewed/v0.4/**'
      - 'data/v0.5/typed-edges-reviewed-pass*.json'
      - 'data/v0.5/resonance-no-semantic-edge.json'
      - 'pathways/**'
      - 'reports/**'
      - 'schemas/**'
      - 'scripts/build_v05.py'
      - 'scripts/suggest_relations.py'
      - 'scripts/build_graph_v05.py'
      - 'scripts/validate_pathways.py'
      - 'scripts/analyze_pathway_reports.py'
      - '.github/workflows/build-v05.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate v0.5
        run: python scripts/build_v05.py

      - name: Generate conservative relation candidates
        run: python scripts/suggest_relations.py

      - name: Build reviewed graph export
        run: python scripts/build_graph_v05.py

      - name: Validate experiential pathways
        run: python scripts/validate_pathways.py

      - name: Analyze structured pathway reports
        run: python scripts/analyze_pathway_reports.py

      - name: Commit generated artifacts when changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- data/v0.5 graph/v0.5 analysis audit/v0.5-qa-report.md audit/v0.5-relation-candidate-pass1.md audit/v0.5-graph-qa.md audit/pathway-qa.md audit/pathway-report-analysis-qa.md; then
            echo 'Generated NC × Lux artifacts are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v0.5 graph/v0.5 analysis audit/v0.5-qa-report.md audit/v0.5-relation-candidate-pass1.md audit/v0.5-graph-qa.md audit/pathway-qa.md audit/pathway-report-analysis-qa.md
          git commit -m 'build: regenerate NC × Lux derived artifacts'
          git push
